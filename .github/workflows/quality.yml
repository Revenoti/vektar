name: Website quality
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_WEB_CALLS: 'false'
      ENABLE_CALLBACKS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-quality-evidence
          path: |
            playwright-report/
            test-results/
            qa/
          retention-days: 14
