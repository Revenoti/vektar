# Static presentation only. Use the Node server for the complete voice/callback service.
# No SPA catch-all: prerendered routes resolve directly and unknown pages stay 404.
[build]
  command = "npm run build"
  publish = "dist"
[[redirects]]
  from = "/solutions"
  to = "/services"
  status = 301
[[redirects]]
  from = "/industries"
  to = "/services"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/call"
  status = 301
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
